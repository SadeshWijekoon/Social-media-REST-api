name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Update if you're using a different version

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Ensure Jest is installed correctly
      - name: Check installed packages
        run: npm list --depth=0

      # Run tests using npx to ensure Jest is executed
      - name: Run tests
        run: npx jest
