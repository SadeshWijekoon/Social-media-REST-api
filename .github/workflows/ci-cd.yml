on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js (updated to version 16 or later)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # Update to Node.js 16 or a later version

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Ensure Jest is installed correctly
      - name: Check installed packages
        run: npm list --depth=0

      # Run tests using npx to ensure Jest is executed
      - name: Run tests
        run: npx jest --ci --maxWorkers=2

      # Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
