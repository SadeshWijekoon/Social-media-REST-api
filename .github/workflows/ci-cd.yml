jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js (make sure it matches your Node version)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Fix permissions for Jest before running tests
      - name: Fix permissions for Jest
        run: sudo chmod +x ./node_modules/.bin/jest

      # Run tests (ensure Jest is working correctly)
      - name: Run tests
        run: npm run test -- --ci --maxWorkers=2

      # Deploy to Vercel (only if tests pass)
      - name: Deploy to Vercel
        if: success()  # This ensures the deploy step runs only if tests pass
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
