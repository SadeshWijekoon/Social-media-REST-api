push:
  branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Update if you're using a different version

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Ensure Jest is installed correctly
      - name: Check installed packages
        run: npm list --depth=0

      # Run tests using npx to ensure Jest is executed
      - name: Run tests
        run: npx jest --ci --maxWorkers=2  # Add CI flag for better performance in CI/CD

      # Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'  # Optional: deploy to production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}  # Ensure environment variable for token is set
