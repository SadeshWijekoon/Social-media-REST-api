name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch
  pull_request:
    branches:
      - main  # Optionally, trigger deployment on PR to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js (make sure it matches your Node version)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests (ensure Jest is working correctly)
      - name: Run tests
        run: npm run test -- --ci --maxWorkers=2  # Adjust for your test configuration

      # Fix permissions if necessary for Jest
      - name: Fix permissions for Jest
        run: sudo chmod +x ./node_modules/.bin/jest

      # Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'  # Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Optionally, notify or perform additional steps here

